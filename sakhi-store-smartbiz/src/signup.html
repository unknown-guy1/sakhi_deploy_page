<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Primary Meta Tags -->
    <title>Join SmartBiz - Sign Up for Free | Sakhi Store</title>
    <meta name="title" content="Join SmartBiz - Sign Up for Free | Sakhi Store">
    <meta name="description" content="Join SmartBiz and start building your D2C business today. Free until December 2025. No credit card required.">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://smartbiz.sakhistore.com/signup.html">
    <meta property="og:title" content="Join SmartBiz - Sign Up for Free">
    <meta property="og:description" content="Join SmartBiz and start building your D2C business today. Free until December 2025.">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://smartbiz.sakhistore.com/signup.html">
    <meta property="twitter:title" content="Join SmartBiz - Sign Up for Free">
    <meta property="twitter:description" content="Join SmartBiz and start building your D2C business today. Free until December 2025.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="signup-wrapper">
        <div class="signup-content">
            <div class="logo" style="display: flex; align-items: center; gap: 0.1rem; margin-bottom: 2rem;">
                <img src="images/logo_sakhi-removebg-preview.png" alt="Sakhi Store Logo" class="logo-image" style="height: 40px; width: auto;">
                <div>
                    <div class="logo-main">SmartBiz</div>
                    <div class="logo-sub">by Sakhi Store</div>
                </div>
            </div>

            <h1 class="signup-title">Join the Revolution in D2C Commerce</h1>
            <p class="signup-text">We are launching soon. Be the first to know when we go live and get exclusive early
                access benefits.</p>

            <form class="signup-form"
                onsubmit="event.preventDefault(); alert('Thanks for signing up! We will be in touch.');">
                <input type="email" placeholder="Enter your email address" required class="signup-input">
                <button type="submit" class="btn-primary" style="border-radius: 8px; padding: 0.75rem 2rem;">Get Early
                    Access</button>
            </form>

            <a href="index.html"
                style="color: #666; text-decoration: none; font-size: 0.9rem; margin-top: 1rem; display: inline-block;">&larr;
                Back to Home</a>
        </div>
        <div class="signup-visual">
            <div class="hero-illustration">
                <div style="font-size: 5rem;">✨</div>
            </div>
        </div>
    </div>
</body>

</html>
